<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>梦境管理员测试，看看你掌管什么梦</title>
<style>
  :root{
    --acc:#4f6bdd; --acc2:#8aa0f5; --gold:#b8892c;
    --bg1:#f2f4ff; --bg2:#dfe4fa;
    --ink:#1c2247; --sub:#7d84a8; --card:#ffffff; --line:#c9d2f2;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh}
  .wrap{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:18px 18px 28px}

  /* ---------- 首页 ---------- */
  .hero{text-align:center;padding:26px 8px 18px}
  .hero .emoji{font-size:54px;line-height:1}
  .hero h1{font-size:25px;line-height:1.45;margin:14px 4px 8px;font-weight:800}
  .hero h1 .hl{color:var(--acc)}
  .hero .sub{font-size:14px;color:var(--sub);margin-bottom:18px;line-height:1.7}
  .tags{display:flex;flex-direction:column;gap:9px;margin:6px 4px 20px}
  .tag{background:var(--card);border-radius:14px;padding:12px 14px;font-size:14px;text-align:left;
    box-shadow:0 2px 10px rgba(79,107,221,.10);border:1px solid var(--line)}
  .tag b{color:var(--acc)}
  .btn{display:block;width:100%;padding:16px;border:none;border-radius:999px;font-size:18px;font-weight:700;
    color:#fff;background:linear-gradient(90deg,var(--acc),var(--acc2));cursor:pointer;
    box-shadow:0 6px 18px rgba(79,107,221,.30);letter-spacing:2px}
  .btn:active{transform:scale(.97)}
  .footnote{text-align:center;font-size:12px;color:#9aa0c0;margin-top:14px;line-height:1.7}
  .deco{margin-top:22px;font-size:13px;color:#b3b8d4;text-align:center;line-height:1.9}

  /* ---------- 答题 ---------- */
  .bar{height:8px;background:#ccd5f5;border-radius:99px;overflow:hidden;margin:10px 0 6px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .3s}
  .count{text-align:right;font-size:12px;color:var(--sub);margin-bottom:10px}
  .q{background:var(--card);border-radius:18px;padding:20px 16px;font-size:17px;font-weight:700;line-height:1.6;
    box-shadow:0 4px 14px rgba(79,107,221,.12);margin-bottom:16px}
  .q .num{display:inline-block;font-size:12px;font-weight:600;color:#fff;background:var(--acc2);
    border-radius:99px;padding:3px 10px;margin-bottom:10px}
  .opts{display:flex;flex-direction:column;gap:11px}
  .opt{background:var(--card);border:1.5px solid var(--line);border-radius:15px;padding:14px 15px;font-size:15px;
    line-height:1.55;text-align:left;cursor:pointer;transition:.15s;color:var(--ink)}
  .opt:active{background:var(--bg1);border-color:var(--acc);transform:scale(.98)}

  /* ---------- 结果 ---------- */
  .result{text-align:center;padding-top:22px}
  .result .emoji{font-size:56px}
  .result .name{font-size:24px;font-weight:800;color:var(--acc);margin-top:10px}
  .result .tagline{font-size:15px;color:var(--gold);margin-top:6px;font-weight:700}
  .card{background:var(--card);border-radius:18px;padding:18px 16px;text-align:left;margin-top:16px;
    box-shadow:0 4px 14px rgba(79,107,221,.12);font-size:14px;line-height:1.85}
  .card h3{font-size:13px;color:var(--acc);margin-bottom:8px;letter-spacing:1px}
  .card.fix{border-left:4px solid var(--gold)}
  .card.fix h3{color:var(--gold)}
  .stat{font-size:12px;color:var(--sub);margin-top:14px;line-height:1.7}
  .share{margin-top:16px;padding:14px;border:none;border-radius:999px;font-size:15px;font-weight:700;
    color:var(--acc);background:#fff;border:1.5px solid var(--acc);cursor:pointer;width:100%}
  .again{margin-top:10px}
  .hidden{display:none}
  @keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
  .pop{animation:pop .35s ease}
</style>
</head>
<body>
<div class="wrap">

  <!-- 首页 -->
  <section id="home">
    <div class="hero">
      <div class="emoji">🌙</div>
      <h1>梦境管理员测试<br><span class="hl">看看你掌管什么梦</span></h1>
      <div class="sub">坠楼、飞行、迟到、老宅——<br>每场梦背后，都有人值班</div>
    </div>
    <div class="tags">
      <div class="tag">✅ <b>梦境档案</b>｜你的梦属于哪个辖区</div>
      <div class="tag">✅ <b>值班风格</b>｜你是个什么样的管理员</div>
      <div class="tag">✅ <b>十大辖区</b>｜从奔逃管理局到糖果特区</div>
      <div class="tag">✅ <b>管理守则</b>｜今晚就这么管</div>
    </div>
    <button class="btn" onclick="start()">点击测试 →</button>
    <div class="footnote">趣味测试仅供娱乐，不构成任何解梦建议</div>
    <div class="deco">32 道梦境场景题 · 10 个辖区 · 约 3 分钟<br>答完记得回评论区领工牌 👀</div>
  </section>

  <!-- 答题 -->
  <section id="quiz" class="hidden">
    <div class="bar"><i id="pbar"></i></div>
    <div class="count"><span id="cnow">1</span> / 32</div>
    <div class="q"><span class="num" id="qnum"></span><br><span id="qtext"></span></div>
    <div class="opts" id="opts"></div>
  </section>

  <!-- 结果 -->
  <section id="res" class="hidden">
    <div class="result">
      <div class="emoji pop" id="remoji">🌙</div>
      <div class="name pop" id="rname"></div>
      <div class="tagline pop" id="rtag"></div>
      <div class="card"><h3>🌙 管理员档案</h3><div id="rbody"></div></div>
      <div class="card"><h3>🗝️ 你的管理守则</h3><div id="rstep"></div></div>
      <div class="card fix"><h3>⚠️ 辖区隐患</h3><div id="rwarn"></div></div>
      <div class="stat" id="rstat"></div>
      <button class="share" onclick="copyRes()">📋 复制工牌，去评论区报到</button>
      <button class="share again" onclick="location.reload()">🔄 再测一次（今晚换个梦？）</button>
      <div class="footnote">趣味测试仅供娱乐，不构成任何解梦建议</div>
    </div>
  </section>

</div>

  ["梦里想通了白天卡住的题","H"],
  ["梦里续上了没做完的事","F"],
  ["梦里重考了一场旧试","D"],
  ["梦里踩空、浑身一抽","G"]],
 ["梦里的天气通常是：",
  ["星空和大雾","A"],
  ["雨天，湿漉漉的","G"],
  ["晴天，光线很好","I"],
  ["说不上来，反正很急","B"]],
 ["别人说「我昨晚做了个特离谱的梦」，你会：",
  ["眼睛发亮，追着问细节","H"],
  ["心里羡慕：我都记不住","J"],
  ["接一句：这梦有点东西","F"],
  ["共情：我上次也梦到过","E"]],
 ["你觉得梦最大的用处是：",
  ["替白天收尾，理顺情绪","F"],
  ["预演不敢做的事","D"],
  ["存放回不去的时光","E"],
  ["什么都别管，纯放松","I"]],
 ["睡前最后一件事，你习惯：",
  ["刷手机刷到眼皮打架","F"],
  ["想事情，越想越清醒","D"],
  ["数着呼吸放空","A"],
  ["想试试今晚能不能飞","C"]],
 ["梦里发生了好事，你的反应是：",
  ["小心护着，怕醒","I"],
  ["使劲记住每个细节","H"],
  ["反正会忘，先享受","J"],
  ["想让TA也看看","A"]],
 ["用一个词形容你的梦：",
  ["辽阔","A"],
  ["赶","D"],
  ["甜","I"],
  ["抓不住","J"]]
];

let idx = 0, score = {};
const $ = id => document.getElementById(id);

function start(){
  idx = 0; score = {};
  $("home").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  render();
}
function render(){
  const q = QS[idx];
  $("qnum").textContent = "第 " + (idx+1) + " 题";
  $("qtext").textContent = q[0];
  $("cnow").textContent = idx+1;
  $("pbar").style.width = (idx/32*100) + "%";
  const box = $("opts"); box.innerHTML = "";
  q.slice(1).forEach(([text,key])=>{
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = text;
    b.onclick = ()=>pick(key);
    box.appendChild(b);
  });
  window.scrollTo(0,0);
}
function pick(key){
  score[key] = (score[key]||0) + 1;
  idx++;
  if(idx < QS.length) render(); else show();
}
function show(){
  $("quiz").classList.add("hidden");
  $("res").classList.remove("hidden");
  const order = ["A","B","C","D","E","F","G","H","I","J"];
  let best = order[0];
  order.forEach(k=>{ if((score[k]||0) > (score[best]||0)) best = k; });
  const t = TYPES[best];
  $("remoji").textContent = t.e;
  $("rname").textContent = t.n;
  $("rtag").textContent = "—— " + t.t + " ——";
  $("rbody").textContent = t.b;
  $("rstep").textContent = t.s;
  $("rwarn").textContent = t.w;
  const sorted = order.map(k=>[k,score[k]||0]).sort((a,b)=>b[1]-a[1]);
  const second = TYPES[sorted[1][0]];
  $("rstat").textContent = "次高辖区：" + second.n + "（" + second.t + "）· 32 题答完，" + (score[best]||0) + " 题指向这个辖区。梦没有好坏，值班的人靠谱就行。";
  $("res").dataset.text = "我在「梦境管理员测试」里测出了【" + t.n + "】："
    + t.t + "。" + t.s + " 来测测你掌管什么梦 →";
  window.scrollTo(0,0);
}
function copyRes(){
  const text = $("res").dataset.text;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>alert("已复制，去评论区领工牌吧 👀"));
  }else{
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    alert("已复制，去评论区领工牌吧 👀");
  }
}
</script>
